name: Ecosystem facts

on:
  pull_request:
    paths:
      - "facts/**"
      - "profile/README.md"
      - "scripts/validate-facts.mjs"
      - "tests/**"
      - ".github/workflows/facts.yml"
  push:
    branches: [main]
    paths:
      - "facts/**"
      - "profile/README.md"
      - "scripts/validate-facts.mjs"
      - "tests/**"
      - ".github/workflows/facts.yml"
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test contracts
        run: node --test tests/*.test.mjs
      - name: Validate facts and profile
        run: node scripts/validate-facts.mjs
      - name: Open or update drift issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Ecosystem facts validation failed"
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            })
            const existing = issues.find(issue => !issue.pull_request && issue.title === title)
            const body = `Scheduled validation failed in ${context.workflow}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }
