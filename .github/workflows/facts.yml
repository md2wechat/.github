name: Ecosystem facts

on:
  pull_request:
    paths:
      - "facts/**"
      - "profile/README.md"
      - "scripts/validate-facts.mjs"
      - "tests/**"
      - ".github/workflows/facts.yml"
  push:
    branches: [main]
    paths:
      - "facts/**"
      - "profile/README.md"
      - "scripts/validate-facts.mjs"
      - "tests/**"
      - ".github/workflows/facts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Test contracts
        run: node --test tests/*.test.mjs
      - name: Validate facts and profile
        run: node scripts/validate-facts.mjs
